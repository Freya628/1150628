<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兩千單聽觸視界 - 克漏字挖空練習</title>
    <!-- 載入外部單字資料 -->
    <script src="words_en_2000.js"></script>
    <style>
        :root { 
            --primary: #2c3e50;
            --secondary: #e74c3c;
            --accent: #3498db;
            --bg: #121212;
            --text: #ffffff;
            --highlight: #f1c40f;
            --panel-bg: #1e1e1e;
            --success: #27ae60;
            --error: #e74c3c;
            --gray: #7f8c8d;
        }

        /* 全域樣式 */
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Century Gothic', '微軟正黑體', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 明顯的焦點樣式 */
        *:focus {
            outline: 5px solid var(--highlight);
            outline-offset: 4px;
        }

        /* 返回大廳按鈕 */
        .back-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: var(--panel-bg);
            color: var(--text);
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid var(--highlight);
            border-radius: 8px;
            font-weight: bold;
            z-index: 1000;
            transition: all 0.3s;
        }
        .back-nav:hover, .back-nav:focus {
            background-color: var(--accent);
        }

        header {
            margin-top: 60px;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--highlight);
            font-size: 2.2em;
            margin: 0;
        }

        .subtitle {
            color: var(--gray);
            font-size: 1.1em;
            margin-top: 10px;
        }

        /* 容器設計 */
        .container {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 15px;
            border: 3px solid var(--highlight);
            width: 100%;
            max-width: 750px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        /* 畫面切換控制 */
        .screen {
            display: none;
            width: 100%;
        }
        .screen.active {
            display: block;
        }

        /* 按鈕設計 */
        .btn {
            font-size: 1.3em;
            padding: 12px 25px;
            background-color: var(--highlight);
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            display: block;
            margin: 15px 0;
            transition: transform 0.2s, filter 0.2s;
        }
        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }
        .btn-secondary { background-color: var(--accent); color: #fff; }
        .btn-tool { background-color: var(--success); color: #fff; }
        .btn-gray { background-color: var(--gray); color: #fff; }

        /* 主題清單 */
        #lesson-list-container {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        /* 工具箱區 */
        .toolbox-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #444;
        }
        .toolbox-title {
            color: var(--secondary);
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        /* 學習畫面細節 */
        .progress-text {
            color: var(--gray);
            text-align: right;
            font-size: 1em;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .word-display {
            font-size: 4em;
            color: var(--highlight);
            font-weight: bold;
            letter-spacing: 5px;
            margin: 20px 0;
        }
        .translate-display {
            font-size: 1.8em;
            margin-bottom: 25px;
        }
        .sentence-card {
            background-color: #222;
            border-left: 8px solid var(--highlight);
            padding: 20px;
            text-align: left;
            margin-bottom: 25px;
            border-radius: 5px;
            line-height: 1.5;
        }

        /* 克漏字測驗區 */
        .cloze-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background-color: #000;
            padding: 20px;
            border: 2px dashed var(--success);
            border-radius: 10px;
            margin: 20px 0;
        }
        .cloze-box {
            width: 55px;
            height: 65px;
            font-size: 2.5em;
            text-align: center;
            background-color: #fff9c4;
            color: #000;
            border: 3px solid var(--accent);
            border-radius: 8px;
            font-weight: bold;
            text-transform: lowercase;
        }
        .cloze-box:disabled {
            background-color: #c8e6c9;
            border-color: var(--success);
            color: var(--success);
        }
        .static-char {
            font-size: 2.8em;
            font-weight: bold;
            min-width: 30px;
            display: inline-block;
        }

        /* 全字複寫區 */
        .full-word-label {
            display: block;
            margin: 25px 0 10px;
            font-weight: bold;
            text-align: left;
            font-size: 1.2em;
        }
        #full-word-input {
            width: 100%;
            min-height: 80px;
            font-size: 2.2em;
            font-weight: bold;
            text-align: center;
            background-color: #fff9c4;
            border: 4px solid var(--gray);
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
            color: var(--secondary);
            resize: none;
            overflow: hidden;
        }
        #full-word-input:focus {
            background-color: #fff;
        }
        #full-word-input.correct {
            border-color: var(--success);
            background-color: #e8f5e9;
            color: var(--success);
        }
        #full-word-input.error {
            border-color: var(--error);
            background-color: #ffebee;
        }

        .feedback-area {
            min-height: 1.5em;
            margin: 20px 0;
            font-size: 1.4em;
            font-weight: bold;
        }

        /* 隱藏區 (無障礙) */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            border: 0;
        }

        /* 手機版調整 */
        @media (max-width: 640px) {
            .back-nav {
                top: 10px;
                left: 10px;
                font-size: 0.95rem;
                padding: 8px 14px;
            }
            body { padding-top: 64px; }
            .word-display { font-size: 3em; }
            .cloze-box { width: 45px; height: 55px; font-size: 1.8em; }
            .static-char { font-size: 2em; }
        }

        /* 列印隱藏 */
        @media print {
            .back-nav, header { display: none !important; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-nav back-to-lobby" aria-label="返回學員作品展示大廳">⬅ 返回大廳</a>

    <header class="header-area">
        <h1 id="main-title">📝 兩千單無障礙克漏字</h1>
        <p class="subtitle">挖空測驗 ＋ 全字複寫，加深肌肉記憶！</p>
    </header>

    <!-- 螢幕閱讀器宣告區 -->
    <div aria-live="assertive" aria-atomic="true" class="sr-only" id="announcer"></div>

    <!-- 畫面一：主題選單 -->
    <main id="screen-menu" class="screen container active">
        <h2 id="menu-title" tabindex="-1">請選擇要練習的分類主題</h2>
        <div id="lesson-list-container">
            <!-- 這裡會動態填入主題按鈕 -->
        </div>

        <div class="toolbox-area">
            <h3 class="toolbox-title">📓 複習工具箱</h3>
            <p id="error-status">目前已累積 0 筆錯題紀錄。</p>
            <button class="btn btn-tool" onclick="exportErrorLog()" aria-label="匯出目前答錯的單字本">📝 匯出專屬錯題本 (.txt)</button>
        </div>
    </main>

    <!-- 畫面二：單字學習 -->
    <main id="screen-learn" class="screen container">
        <div class="progress-text" id="learn-progress">進度：0 / 0</div>
        <h2 id="learn-heading" tabindex="-1">新單字學習</h2>
        
        <div class="word-display" id="target-word">apple</div>
        <div class="translate-display" id="target-translate">蘋果</div>

        <div id="sentence-area" class="sentence-card">
            <p id="sentence-text"></p>
        </div>

        <button class="btn btn-secondary" onclick="playCurrentWordSound()" aria-label="聽取單字與中文朗讀">🔊 聽讀音</button>
        <button class="btn" onclick="startClozeTest()">我學會了，開始測驗</button>
        <button class="btn btn-gray" onclick="backToMenu()">返回主題選單</button>
    </main>

    <!-- 畫面三：克漏字測驗 -->
    <main id="screen-cloze" class="screen container">
        <div class="progress-text" id="cloze-progress">作答進度：0 / 0</div>
        <h2 id="cloze-heading" tabindex="-1">測驗：中文解釋</h2>
        
        <div id="cloze-container" class="cloze-container" role="group" aria-label="單字挖空拼寫區">
            <!-- 動態產生挖空格與靜態字母 -->
        </div>

        <label for="full-word-input" class="full-word-label">步驟二：請再次輸入一次完整的單字</label>
        <textarea id="full-word-input" placeholder="在此輸入完整單字..." aria-label="全字複寫輸入區"></textarea>

        <div id="feedback-area" class="feedback-area" aria-live="polite"></div>

        <button id="btn-submit" class="btn btn-secondary" onclick="checkAnswer()">批改答案</button>
        <button id="btn-next" class="btn" style="display:none;" onclick="nextWord()">答對了，下一題</button>
        <button class="btn btn-gray" onclick="backToMenu()">中斷測驗並返回選單</button>
    </main>

    <script>
        // --- 全域變數 ---
        let currentLessonList = [];
        let currentIndex = 0;
        let currentWordObj = null;
        let blankIndices = [];
        const synth = window.speechSynthesis;
        let errorLogData = [];

        // --- 初始化 ---
        window.onload = () => {
            initMenu();
        };

        // --- 畫面控制 ---
        function showScreen(id, focusId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (focusId) {
                setTimeout(() => {
                    const el = document.getElementById(focusId);
                    if (el) el.focus();
                }, 150);
            }
        }

        function announce(msg) {
            document.getElementById('announcer').textContent = msg;
        }

        // --- 主選單功能 ---
        function initMenu() {
            const container = document.getElementById('lesson-list-container');
            container.innerHTML = '';

            // 檢查資料庫是否存在
            if (!window.englishDb || !window.englishDb["會考2000單"] || !window.englishDb["會考2000單"]["主題分類"]) {
                container.innerHTML = `
                    <p style="color:var(--error); font-weight:bold; font-size:1.2em;">
                        ⚠️ 警告：找不到 2000 單字庫！<br>
                        請確認 words_en_2000.js 檔案已放置於同一資料夾內。
                    </p>`;
                return;
            }

            const categories = window.englishDb["會考2000單"]["主題分類"];
            for (let themeName in categories) {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = `開始練習：${themeName}`;
                btn.onclick = () => startLesson(themeName);
                container.appendChild(btn);
            }
            updateErrorStatus();
        }

        function updateErrorStatus() {
            document.getElementById('error-status').textContent = `目前已累積 ${errorLogData.length} 筆錯題紀錄。`;
        }

        // --- 學習流程 ---
        function startLesson(themeName) {
            const originalList = window.englishDb["會考2000單"]["主題分類"][themeName];
            // 複製並隨機打亂
            currentLessonList = [...originalList].sort(() => Math.random() - 0.5);
            currentIndex = 0;
            announce(`已選擇 ${themeName}。總共 ${currentLessonList.length} 個單字。準備開始學習。`);
            loadWordPhase();
        }

        function loadWordPhase() {
            if (currentIndex >= currentLessonList.length) {
                alert("恭喜！本主題單字已全部複習完畢！");
                backToMenu();
                return;
            }

            currentWordObj = currentLessonList[currentIndex];
            
            // 更新介面
            document.getElementById('learn-progress').textContent = `進度：${currentIndex + 1} / ${currentLessonList.length}`;
            document.getElementById('target-word').textContent = currentWordObj.word;
            document.getElementById('target-translate').textContent = currentWordObj.translate;

            const sentenceArea = document.getElementById('sentence-area');
            if (currentWordObj.sentence) {
                sentenceArea.style.display = 'block';
                document.getElementById('sentence-text').textContent = currentWordObj.sentence;
            } else {
                sentenceArea.style.display = 'none';
            }

            showScreen('screen-learn', 'learn-heading');
            
            // 短暫延遲後播放讀音
            setTimeout(() => {
                playCurrentWordSound();
            }, 600);
        }

        function playCurrentWordSound() {
            synth.cancel();

            // 1. 英文單字
            const utterWord = new SpeechSynthesisUtterance(currentWordObj.word);
            utterWord.lang = 'en-US';

            // 2. 中文解釋
            const utterTranslate = new SpeechSynthesisUtterance(currentWordObj.translate);
            utterTranslate.lang = 'zh-TW';

            // 3. 例句處裡 (拆解英中)
            let utterSentEng = null;
            let utterSentChi = null;

            if (currentWordObj.sentence) {
                const match = currentWordObj.sentence.match(/^(.*?)\s*\((.*)\)$/);
                if (match) {
                    utterSentEng = new SpeechSynthesisUtterance(match[1]);
                    utterSentEng.lang = 'en-US';
                    utterSentChi = new SpeechSynthesisUtterance(match[2]);
                    utterSentChi.lang = 'zh-TW';
                } else {
                    utterSentEng = new SpeechSynthesisUtterance(currentWordObj.sentence);
                    utterSentEng.lang = 'en-US';
                }
            }

            // 串接朗讀順序
            utterWord.onend = () => synth.speak(utterTranslate);
            if (utterSentEng) {
                utterTranslate.onend = () => synth.speak(utterSentEng);
                if (utterSentChi) {
                    utterSentEng.onend = () => synth.speak(utterSentChi);
                }
            }

            synth.speak(utterWord);
        }

        // --- 測驗流程 ---
        function startClozeTest() {
            synth.cancel();
            
            document.getElementById('cloze-progress').textContent = `作答進度：${currentIndex + 1} / ${currentLessonList.length}`;
            document.getElementById('cloze-heading').textContent = `測驗：${currentWordObj.translate}`;

            const word = currentWordObj.word;
            const container = document.getElementById('cloze-container');
            container.innerHTML = '';

            // 計算挖空
            const alphabetIndices = [];
            for (let i = 0; i < word.length; i++) {
                if (/[a-zA-Z]/.test(word[i])) alphabetIndices.push(i);
            }

            const blankCount = Math.max(1, Math.floor(alphabetIndices.length / 2));
            const shuffledPool = [...alphabetIndices].sort(() => Math.random() - 0.5);
            blankIndices = shuffledPool.slice(0, blankCount).sort((a, b) => a - b);

            // 產生 UI
            for (let i = 0; i < word.length; i++) {
                if (word[i] === ' ') {
                    const space = document.createElement('span');
                    space.style.width = '20px';
                    container.appendChild(space);
                } else if (blankIndices.includes(i)) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'cloze-box';
                    input.maxLength = 1;
                    input.setAttribute('aria-label', `單字第 ${i + 1} 個字母挖空`);
                    input.oninput = function() {
                        this.value = this.value.replace(/[^a-zA-Z]/g, '').toLowerCase();
                        if (this.value.length === 1) {
                            const next = this.nextElementSibling;
                            if (next && next.tagName === 'INPUT') {
                                next.focus();
                            } else if (next && next.nextElementSibling && next.nextElementSibling.tagName === 'INPUT') {
                                next.nextElementSibling.focus();
                            } else {
                                // 尋找後續所有元素中第一個 input
                                let sibling = this.nextElementSibling;
                                while(sibling) {
                                    if(sibling.tagName === 'INPUT') {
                                        sibling.focus();
                                        return;
                                    }
                                    sibling = sibling.nextElementSibling;
                                }
                                document.getElementById('full-word-input').focus();
                            }
                        }
                    };
                    container.appendChild(input);
                } else {
                    const charSpan = document.createElement('span');
                    charSpan.className = 'static-char';
                    charSpan.textContent = word[i].toLowerCase();
                    container.appendChild(charSpan);
                }
            }

            // 重置複寫區
            const fullInput = document.getElementById('full-word-input');
            fullInput.value = '';
            fullInput.className = '';
            fullInput.oninput = function() {
                this.style.height = 'auto';
                this.style.height = this.scrollHeight + 'px';
            };

            document.getElementById('feedback-area').innerHTML = '';
            document.getElementById('btn-submit').style.display = 'block';
            document.getElementById('btn-next').style.display = 'none';

            showScreen('screen-cloze', 'cloze-heading');
            announce(`開始測驗。請在空格填入字母，並在下方輸入完整單字。`);

            // 焦點移至第一個輸入框
            setTimeout(() => {
                const firstInput = container.querySelector('input');
                if (firstInput) firstInput.focus();
            }, 300);
        }

        function checkAnswer() {
            const targetWord = currentWordObj.word.toLowerCase();
            const fullVal = document.getElementById('full-word-input').value.trim().toLowerCase().replace(/\s+/g, ' ');
            
            // 重建挖空答案
            const inputs = document.querySelectorAll('.cloze-box');
            let studentClozeWord = "";
            let inputCounter = 0;
            for (let i = 0; i < currentWordObj.word.length; i++) {
                if (currentWordObj.word[i] === ' ') {
                    studentClozeWord += " ";
                } else if (blankIndices.includes(i)) {
                    studentClozeWord += inputs[inputCounter].value;
                    inputCounter++;
                } else {
                    studentClozeWord += currentWordObj.word[i].toLowerCase();
                }
            }

            if (studentClozeWord === targetWord && fullVal === targetWord) {
                handleSuccess();
            } else {
                handleError();
            }
        }

        function handleSuccess() {
            const feedback = document.getElementById('feedback-area');
            feedback.innerHTML = `<span class="text-success">🌟 完全正確！單字記憶加深了。</span>`;
            if (currentWordObj.sentence) {
                feedback.innerHTML += `<br><small style="font-weight:normal; color:#ccc;">完整例句：${currentWordObj.sentence}</small>`;
            }
            feedback.className = 'feedback-area text-success';

            const fullInput = document.getElementById('full-word-input');
            fullInput.classList.remove('error');
            fullInput.classList.add('correct');

            document.querySelectorAll('.cloze-box').forEach(input => {
                input.disabled = true;
                input.style.color = "var(--success)";
                input.style.borderColor = "var(--success)";
            });

            document.getElementById('btn-submit').style.display = 'none';
            document.getElementById('btn-next').style.display = 'block';

            announce("完全正確！");
            synth.cancel();
            const utter = new SpeechSynthesisUtterance("Correct! " + currentWordObj.word);
            utter.lang = 'en-US';
            synth.speak(utter);
            
            document.getElementById('btn-next').focus();
        }

        function handleError() {
            const feedback = document.getElementById('feedback-area');
            feedback.textContent = "❌ 拼寫有些錯誤，請聽聲音再試一次！";
            feedback.className = 'feedback-area text-error';

            const fullInput = document.getElementById('full-word-input');
            fullInput.classList.add('error');

            // 錯誤提示：挖空格閃紅並清空
            const inputs = document.querySelectorAll('.cloze-box');
            inputs.forEach(input => {
                input.style.backgroundColor = "#ffcdd2";
                setTimeout(() => {
                    input.style.backgroundColor = "#fff9c4";
                    input.value = "";
                }, 800);
            });

            // 記錄錯題
            const errorString = `❌ 單字：${currentWordObj.word} = ${currentWordObj.translate}`;
            if (!errorLogData.includes(errorString)) {
                errorLogData.push(errorString);
            }
            updateErrorStatus();

            announce("拼寫錯誤。");
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(currentWordObj.word);
            utter.lang = 'en-US';
            synth.speak(utter);

            fullInput.focus();
            fullInput.select();
        }

        function nextWord() {
            currentIndex++;
            loadWordPhase();
        }

        function backToMenu() {
            synth.cancel();
            showScreen('screen-menu', 'menu-title');
        }

        // --- 錯題本匯出 ---
        function exportErrorLog() {
            if (errorLogData.length === 0) {
                announce("目前沒有錯題紀錄");
                alert("太棒了！目前沒有任何錯題紀錄喔！");
                return;
            }

            const studentName = prompt("請輸入學生姓名：", "學生") || "學生";
            const now = new Date().toLocaleString();
            let content = `=======================================\n`;
            content += `  📝 ${studentName} 的克漏字挖空 專屬錯題本\n`;
            content += `  建立時間：${now}\n`;
            content += `=======================================\n\n`;
            
            errorLogData.forEach(item => {
                content += `${item}\n`;
                content += `---------------------------------------\n`;
            });
            
            content += `\n加油！多複習幾次一定能記住！`;

            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${studentName}_克漏字_錯題本.txt`;
            link.click();
            
            announce("錯題本匯出成功");
        }
    </script>
</body>
</html>
